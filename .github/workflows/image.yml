name: image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "::error title=gofmt::$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  # A tag v1.2.3 publishes ghcr.io/<owner>/<repo>:1.2.3 (and :latest) for amd64 and arm64, and
  # a release whose mikan-addon.json pins that build by digest: added as a source
  # (github.com/<owner>/<repo>), the panel offers the addon from the latest release.
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name and version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
      - name: Report the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "::notice title=Image::${IMAGE}@${DIGEST}"
          printf '### Image\n\n`%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      # The catalog entry mikan reads from a source; users:grant needs panel 0.5.1.0-rc.11
      - name: Catalog entry
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          jq -n --arg image "$IMAGE" --arg digest "$DIGEST" --arg version "$VERSION" \
            --arg home "https://github.com/${GITHUB_REPOSITORY}" '{
              id: "r00tvpn-referrals",
              name: {ru: "Приведи друга", en: "Refer a friend"},
              description: {
                ru: "Личные ссылки-приглашения через отдельного Telegram-бота и дни подписки пригласившему за каждого оплатившего друга",
                en: "Personal invite links through a Telegram bot of its own, and subscription days for every friend who pays"
              },
              version: $version, protocol: 2, kind: "generic", mode: "http",
              permissions: ["users:all", "users:grant", "events", "kv", "ui"],
              resources: {mem_mb: 64},
              image: $image, digest: $digest,
              min_panel: "0.5.1.0-rc.11", homepage: $home
            }' > mikan-addon.json
          cat mikan-addon.json
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: r00tvpn-referrals ${{ env.VERSION }}
          body: |
            Образ: `${{ env.IMAGE }}@${{ steps.build.outputs.digest }}`

            Установка в Mikan: «Аддоны» → «Источники» → добавить `github.com/${{ github.repository }}`.
          files: mikan-addon.json
          fail_on_unmatched_files: true
